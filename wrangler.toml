name = "deribit-mcp"
main = "src/index.js"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

# Durable Objects configuration for MCP Agent
[durable_objects]
bindings = [
  { class_name = "DeribitMCP", name = "MCP_OBJECT" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeribitMCP"]

[observability]
enabled = true

# Production environment (main branch only)
[env.production]
routes = [
  { pattern = "mcp.x.zip/deribit/*", zone_name = "x.zip" }
]

# Preview environment (PRs only) - gets workers.dev URL
[env.preview]
name = "deribit-mcp-preview"

# Optional: Default Deribit API credentials
# Set these as secrets via: wrangler secret put DERIBIT_CLIENT_ID
# DERIBIT_CLIENT_ID and DERIBIT_CLIENT_SECRET should be set as secrets, not vars
# DERIBIT_ENVIRONMENT defaults to "production" (set to "test" if needed for testing)
