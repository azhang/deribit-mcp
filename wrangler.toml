name = "deribit-mcp"
main = "src/index.js"
compatibility_date = "2025-10-09"
compatibility_flags = ["nodejs_compat"]

# Durable Objects configuration for MCP Agent
[durable_objects]
bindings = [
  { class_name = "DeribitMCP", name = "MCP_OBJECT" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeribitMCP"]

[observability]
enabled = true

[env.production]

[env.preview]
name = "deribit-mcp-preview"