name = "deribit-mcp"
main = "src/index.js"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

# Durable Objects configuration for MCP Agent
[durable_objects]
bindings = [
  { class_name = "DeribitMCP", name = "MCP_OBJECT" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DeribitMCP"]

[observability]
enabled = true

routes = [
  { pattern = "mcp.x.zip/deribit/*", zone_name = "x.zip" }
]
