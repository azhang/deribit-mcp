name: v2 (MCP server + skill)
# Deribit spec drift is checked weekly in azhang/deribit-client-js; bump the pinned
# release tag in packages/mcp/package.json, then run `npm run classify` and `npm run build:skill`.

on:
  pull_request:
    paths: ['packages/**', 'skills/**', '.github/workflows/v2.yml']
  push:
    branches: [main]
    paths: ['packages/**', 'skills/**', '.github/workflows/v2.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Server — install, test, build
        working-directory: packages/mcp
        run: |
          npm install --no-package-lock
          npm test
          npm run build
          npm run build:skill -- --check  # skills/deribit/scripts/lib must match the client and analytics
