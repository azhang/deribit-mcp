name: v2 (client + MCP server)

on:
  pull_request:
    paths: ['packages/**', '.github/workflows/v2.yml']
  push:
    branches: [main]
    paths: ['packages/**', '.github/workflows/v2.yml']
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC: check Deribit's published specs for drift
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Client — install, typecheck, test
        working-directory: packages/deribit-client
        run: |
          npm install --no-package-lock
          npm run typecheck
          npm test

      - name: Server — install, test, build
        working-directory: packages/mcp
        run: |
          npm install --no-package-lock
          npm test
          npm run build

  spec-drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check published specs
        id: check
        working-directory: packages/deribit-client
        run: |
          npm install --no-package-lock
          node scripts/check-spec.mjs --write | tee ../../spec-drift.txt
          if git diff --quiet -- spec/; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Regenerate and test
        if: steps.check.outputs.changed == 'true'
        run: |
          (cd packages/deribit-client && npm run generate && npm run typecheck && npm test) 2>&1 | tee -a spec-drift.txt
          (cd packages/mcp && npm install --no-package-lock && npm run classify && npm test) 2>&1 | tee -a spec-drift.txt
        continue-on-error: true # open the PR either way; failing tests are part of what it reports

      - name: Open a PR with the update
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="chore/deribit-spec-$(date -u +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packages/deribit-client/spec packages/deribit-client/src/generated packages/mcp/src/generated
          git commit -m "Update vendored Deribit specs"
          git push -u origin "$branch"
          {
            echo "Deribit's published specs changed. Review the method/param changes below, then check that tools still match."
            echo
            echo '```'
            tail -c 60000 spec-drift.txt
            echo '```'
          } > body.md
          gh pr create --title "Update vendored Deribit specs ($(date -u +%Y-%m-%d))" --body-file body.md
