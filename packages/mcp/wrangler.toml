name = "deribit-mcp-v2"
main = "src/worker.js"
compatibility_date = "2026-10-06"
compatibility_flags = ["nodejs_compat"]

# More specific than v1's mcp.x.zip/deribit/*, so it takes /deribit/v2/* from v1.
# Deployed by Cloudflare Workers Builds on push to main (root directory packages/mcp).
routes = [{ pattern = "mcp.x.zip/deribit/v2/*", zone_name = "x.zip" }]

[vars]
DERIBIT_ENV = "production"
# Optional comma-separated Host allowlist. Unset, a custom domain skips the Host check
# and workers.dev accepts only its own hostname.
# ALLOWED_HOSTNAMES = "mcp.x.zip"

# Per-client-IP limit in front of the shared Deribit key.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[observability]
enabled = true

# Secrets (read-only Deribit key used only for rate limits):
#   wrangler secret put DERIBIT_CLIENT_ID
#   wrangler secret put DERIBIT_CLIENT_SECRET
